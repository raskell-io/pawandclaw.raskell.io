# Zola configuration for the Paw & Claw website
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://paw-and-claw.raskell.io"
title = "Paw & Claw"
description = "A turn-based tactics game of woodland armies. Play it free in your browser, or on your desktop."
default_language = "en"

compile_sass = true
minify_html = true
build_search_index = false
generate_feeds = false

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_referrer = true

[slugify]
paths = "on"
anchors = "on"

[extra]
author = "raskell.io"
tagline = "Tactics of the Woodland Realms"
github = "https://github.com/raskell-io/paw-and-claw"
codeberg = "https://codeberg.org/raskell-io/paw-and-claw"
releases = "https://github.com/raskell-io/paw-and-claw/releases"
play_url = "/play/"
keywords = "Paw & Claw, tactics game, turn-based strategy, Advance Wars, browser game, WebAssembly, Bevy, Rust, woodland"

nav_links = [
    { name = "How to play", url = "/how-to-play/" },
    { name = "Commanders", url = "/commanders/" },
    { name = "Download", url = "/download/" },
]
